name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Installs exactly what package-lock.json lists. node_modules is
      # in .gitignore, so it is not in the repo for checkout to copy.
      - run: npm ci

      - run: npm run lint

      # No secrets needed: vite.config.ts gives the tests their own
      # VITE_API_URL, and they never call the API.
      - run: npm test

      # tsc -b, then vite build: type errors anywhere in src/ fail here,
      # test files included.
      - run: npm run build
